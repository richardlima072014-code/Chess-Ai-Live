name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          unzip -o Chess_AI_Live_Android_Project.zip
          find . -name settings.gradle.kts

      - name: Compilar APK
        run: |
          cd ChessAILive
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-AI-Live-APK
          path: ChessAILive/app/build/outputs/apk/debug/app-debug.apk
