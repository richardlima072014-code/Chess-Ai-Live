name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: unzip -o Chess_AI_Live_Android_Project.zip

      - name: Compilar APK
        working-directory: ChessAILive
        run: gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-AI-Live-APK
          path: ChessAILive/app/build/outputs/apk/debug/app-debug.apk
